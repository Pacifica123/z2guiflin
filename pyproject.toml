[project]
name = "zap2gui-linux"
version = "1.3.0"
description = "Linux PyQt GUI shell around a vendored zapret2 core source tree"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-compatible project shell; vendored upstream keeps its own MIT license notice" }
authors = [
  { name = "Zap2 GUI Linux project" }
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
zap2-gui = "zap2_gui.distribution:main"

[tool.setuptools]
package-dir = {"" = "gui"}

[tool.setuptools.packages.find]
where = ["gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gui"]
addopts = "-q"
# Тесты копируют проект в tmp_path; на tmpfs-/tmp (Arch) три сохранённых прогона
# исчерпывали место (ENOSPC в пачке r2). Храним только каталоги упавших тестов последнего прогона.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
